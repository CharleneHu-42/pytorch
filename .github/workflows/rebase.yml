name: Rebase from Upstream

on:
  schedule:
    - cron: '0 17 * * 4'
  workflow_dispatch:
  push:
    branches:
      - 'rebase_target'

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-22.04

    env:
      TARGET_BRANCH: 'rebase_target'
      UPSTREAM_BASE_BRANCH: 'main'
      UPSTREAM_REPO_URL: 'https://github.com/pytorch/pytorch.git'

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

    # --- START: Crucial Debugging Steps ---
      - name: Debug Branch SHAs
        run: |
          echo "Adding upstream remote..."
          git remote add upstream ${UPSTREAM_REPO_URL} || echo "Upstream remote already exists" # Add '|| echo' to prevent failing if remote exists
          echo "Fetching upstream/${UPSTREAM_BASE_BRANCH}..."
          git fetch upstream ${UPSTREAM_BASE_BRANCH}

          echo "--- Git States as seen by GitHub Actions ---"
          echo "Current branch (TARGET_BRANCH - ${{ env.TARGET_BRANCH }}) SHA: $(git rev-parse HEAD)"
          echo "Upstream base branch (upstream/${{ env.UPSTREAM_BASE_BRANCH }}) SHA: $(git rev-parse upstream/${{ env.UPSTREAM_BASE_BRANCH }})"
          echo ""
          echo "Commits in upstream/${{ env.UPSTREAM_BASE_BRANCH }} but NOT in ${{ env.TARGET_BRANCH }} (i.e., new commits upstream has that you need):"
          git log --oneline ${{ env.TARGET_BRANCH }}..upstream/${{ env.UPSTREAM_BASE_BRANCH }} || echo "No new commits from upstream to apply."
          echo ""
          echo "Commits in ${{ env.TARGET_BRANCH }} but NOT in upstream/${{ env.UPSTREAM_BASE_BRANCH }} (i.e., your unique commits to rebase):"
          git log --oneline upstream/${{ env.UPSTREAM_BASE_BRANCH }}..${{ env.TARGET_BRANCH }} || echo "No unique commits on your target branch."
          echo ""
          echo "Rebase dry-run check (will indicate if conflicts are expected):"
          git rebase --dry-run upstream/${{ env.UPSTREAM_BASE_BRANCH }} 2>&1 || echo "Rebase dry-run completed."
          echo "--- End Git States ---"
          
          # Optional: show remote tracking status
          echo "Git branch tracking info:"
          git branch -vv

    # --- END: Crucial Debugging Steps ---
      
      - name: Attempt rebase
        id: rebase
        run: |
          git remote add upstream ${UPSTREAM_REPO_URL}
          git fetch upstream ${UPSTREAM_BASE_BRANCH}
          set +e
          git rebase upstream/${UPSTREAM_BASE_BRANCH}
          echo "REBASE_EXIT_CODE=$?" >> $GITHUB_ENV
          set -e

      - name: Push if rebase successful
        if: env.REBASE_EXIT_CODE == '0'
        run: |
          git push origin main_next --force-with-lease

      - name: Handle rebase conflict
        if: env.REBASE_EXIT_CODE != '0'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          CURRNET_UPSTREAM_BRANCH="upstream-${UPSTREAM_BASE_BRANCH}-$TIMESTAMP"
          echo "CURRNET_UPSTREAM_BRANCH=$CURRNET_UPSTREAM_BRANCH" >> $GITHUB_ENV
          git rebase --abort
          git checkout -b $CURRNET_UPSTREAM_BRANCH upstream/${UPSTREAM_BASE_BRANCH}
          git push origin $CURRNET_UPSTREAM_BRANCH

      - name: Create PR for conflict resolution
        if: env.REBASE_EXIT_CODE != '0'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.TARGET_BRANCH }}
          branch: ${{ env.CURRNET_UPSTREAM_BRANCH }}
          title: "Rebase conflict with upstream/${{ env.UPSTREAM_BASE_BRANCH }} - ${{ env.TIMESTAMP }}"
          body: |
            This PR was automatically created because a rebase with upstream/${{ env.UPSTREAM_BASE_BRANCH }} resulted in conflicts.
            Please resolve the conflicts manually.

